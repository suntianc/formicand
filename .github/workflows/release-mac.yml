name: Prepare desktop release draft
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build, for example v0.1.2-beta.7
        required: true
        type: string
      all_desktop:
        description: Include signed Windows x64 NSIS and Linux x64 AppImage
        required: false
        default: false
        type: boolean
      replace_notes:
        description: Replace maintainer-reviewed notes in an existing draft with the version document/template
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-mac-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  native-installers:
    if: github.event_name == 'push' || inputs.all_desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: win32
          - runner: ubuntu-24.04
            target: linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: node scripts/release-metadata.mjs
      - run: npm ci
      - name: Build native installer
        run: npm run desktop:dist
        env:
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      - run: node scripts/release-artifacts.mjs --stage-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-installer-${{ matrix.target }}
          path: release/Formicand-*
          if-no-files-found: error
  package:
    needs: native-installers
    if: >-
      always() && !cancelled() &&
      (needs.native-installers.result == 'success' ||
       (needs.native-installers.result == 'skipped' && github.event_name == 'workflow_dispatch' && !inputs.all_desktop))
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_ALL_DESKTOP: ${{ (github.event_name == 'push' || inputs.all_desktop) && '1' || '0' }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Validate tag, package version and source commit
        id: release
        run: node scripts/release-metadata.mjs
      - name: Check release is still a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-draft.mjs check
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: npm run desktop:dist
        env:
          CSC_NAME: ${{ vars.CSC_NAME }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - run: npm run cli:pack
      - if: env.RELEASE_ALL_DESKTOP == '1'
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-installer-*
          path: release
          merge-multiple: true
      - name: Verify artifact provenance and prepare review notes
        run: node scripts/release-artifacts.mjs
      - name: Create draft and upload release packages
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE_NOTES: ${{ inputs.replace_notes || false }}
        run: |
          options=()
          if [[ "$REPLACE_NOTES" == "true" ]]; then options+=(--replace-notes); fi
          node scripts/release-draft.mjs upload "${options[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: Formicand-mac-arm64-${{ steps.release.outputs.version }}
          path: |
            ${{ steps.release.outputs.dmg }}
            ${{ steps.release.outputs.checksum }}
            release/Formicand-${{ steps.release.outputs.version }}-mac-arm64.signing.json
            release/Formicand-${{ steps.release.outputs.version }}-mac-arm64.signing.json.sha256
            release/formicand-cli-${{ steps.release.outputs.version }}.tgz
            release/formicand-cli-${{ steps.release.outputs.version }}.tgz.sha256
            release/formicand-component-*
            release/formicand-release-${{ steps.release.outputs.version }}.json
            release/formicand-release-${{ steps.release.outputs.version }}.json.sha256
            release/formicand-release-${{ steps.release.outputs.version }}.md
          if-no-files-found: error
